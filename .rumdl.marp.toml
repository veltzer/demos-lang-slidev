# Markdown lint rules for Marp / Slidev slide decks (rsmultigit check-same,
# shared with the other slide repos). These files are slide source, not prose:
# they open with `---` YAML frontmatter rather than a heading, so MD041 (first
# line must be a level-1 heading) fights the format. Every other rule from the
# prose .rumdl.toml still applies.

[global]
disable = ["MD022", "MD024", "MD026", "MD031", "MD032", "MD033", "MD034", "MD041"]

[MD007]
indent = 4

[MD013]
line_length = 1000
